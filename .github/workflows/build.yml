name: Build APK

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VIGIERESEAU_KEYSTORE_B64: ${{ secrets.VIGIERESEAU_KEYSTORE_B64 }}
      VIGIERESEAU_KEYSTORE_PASSWORD: ${{ secrets.VIGIERESEAU_KEYSTORE_PASSWORD }}
      VIGIERESEAU_KEY_PASSWORD: ${{ secrets.VIGIERESEAU_KEY_PASSWORD }}
      VIGIERESEAU_KEY_ALIAS: ${{ secrets.VIGIERESEAU_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Assert unit tests actually ran
        run: |
          python3 - <<'EOF'
          import glob, sys, xml.etree.ElementTree as ET
          files = glob.glob('app/build/test-results/**/*.xml', recursive=True)
          total = sum(int(ET.parse(f).getroot().get('tests', 0)) for f in files)
          print(f'{len(files)} classe(s) de test, {total} test(s) unitaires')
          if total < 10:
              sys.exit(f'Trop peu de tests exécutés ({total})')
          EOF

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify signature
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)
          "$BT/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | head -5

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vigie-reseau-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish "latest" release
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        run: |
          VER=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          APK=app/build/outputs/apk/release/app-release.apk
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --title "Vigie Réseau v${VER}" --notes "Build automatique - v${VER}"
          gh release edit latest --title "Vigie Réseau v${VER}" --notes "Build automatique - v${VER}"
          for i in 1 2 3 4 5; do
            gh release upload latest "$APK" --clobber && break
            sleep 10
          done
          printf '{"version":"%s","notes":"Build automatique - v%s","apk":"%s"}\n' \
            "$VER" "$VER" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/latest/app-release.apk" \
            > "$RUNNER_TEMP/version.json"
          for i in 1 2 3 4 5; do
            gh release upload latest "$RUNNER_TEMP/version.json" --clobber && break
            sleep 10
          done
          gh release view latest --json assets -q '.assets[].name' \
            | grep -vx -e 'app-release.apk' -e 'version.json' \
            | while read -r stale; do gh release delete-asset latest "$stale" -y || true; done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
